name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookReader-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "FolioReader v1.0.0 Release"
          body: |
            ### 📖 FolioReader v1.0.0
            Lightweight Native Android PDF Book Reader built with Kotlin & Jetpack Compose.
            
            - **Realistic 3D Canvas Page-Turn Physics**
            - **Facing Pages (Book Spread) on Tablets & Landscape**
            - **Single Page Mode for Mobile**
            - **Warm Paper, Daylight & Midnight Reading Themes**
            - **Offline & Private with Storage Access Framework**
            - **Installed Size: Under 8 MB**
            
            Download the APK attached below to install on your Android device.
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
